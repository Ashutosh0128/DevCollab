name: DevCollab Continuous Integration (CI)

on:
  push:
    branches: [ main, siddhi-work ]
  pull_request:
    branches: [ main, siddhi-work ]

jobs:
  backend-ci:
    name: Django Backend Test & Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devcollab_test
          POSTGRES_USER: devcollab_user
          POSTGRES_PASSWORD: devcollab_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Check
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-must-be-secure-32chars
          DEBUG: 'False'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: devcollab_test
          DB_USER: devcollab_user
          DB_PASSWORD: devcollab_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: python manage.py check

      - name: Verify No Missing Migrations
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-must-be-secure-32chars
          DEBUG: 'False'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: devcollab_test
          DB_USER: devcollab_user
          DB_PASSWORD: devcollab_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: python manage.py makemigrations --check

      - name: Run Backend Unit & Integration Tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-must-be-secure-32chars
          DEBUG: 'False'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: devcollab_test
          DB_USER: devcollab_user
          DB_PASSWORD: devcollab_password
          DB_HOST: localhost
          DB_PORT: 5432
          AI_ENABLED: 'true'
          AI_PROVIDER: 'ollama'
          AI_MODEL: 'qwen2.5:3b'
          OLLAMA_HOST: 'http://localhost:11434'
        run: python manage.py test

  frontend-ci:
    name: React Frontend Type Check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Production Frontend Assets
        working-directory: frontend
        run: npm run build
