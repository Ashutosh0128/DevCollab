services:
  db:
    image: postgres:16-alpine
    container_name: devcollab_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-devcollab}
      POSTGRES_USER: ${DB_USER:-devcollab_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devcollab_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devcollab_user} -d ${DB_NAME:-devcollab}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devcollab_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-${DJANGO_SECRET_KEY:-django-insecure-devcollab-phase10-key}}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-devcollab}
      - DB_USER=${DB_USER:-devcollab_user}
      - DB_PASSWORD=${DB_PASSWORD:-devcollab_password}
      - DB_HOST=db
      - DB_PORT=5432
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - AI_MODEL=${AI_MODEL:-qwen2.5:3b}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devcollab_frontend
    restart: always
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
