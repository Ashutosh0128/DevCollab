services:
  db:
    image: postgres:16-alpine
    container_name: devcollab_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-devcollab}
      POSTGRES_USER: ${DB_USER:-devcollab_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devcollab_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devcollab_user} -d ${DB_NAME:-devcollab}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devcollab_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-devcollab-key}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-devcollab}
      - DB_USER=${DB_USER:-devcollab_user}
      - DB_PASSWORD=${DB_PASSWORD:-devcollab_password}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devcollab_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
